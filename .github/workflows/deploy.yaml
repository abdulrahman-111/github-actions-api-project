name: Cont Deploy to Stagging and production 
on: 
    workflow_run:  ## Cont deliveriy to stagging, then cont deployment as this will run as the docker will flow run 
        workflows:
          - Docker
        types:
            - completed 
jobs:
    deploy-stagging:
        name: Mock deploy to Stagging
        runs-on: ubuntu-latest
        environment:
            name: Stagging
           # url: ${{ vars.APP_URL }} ## attach a deployment URL to that environment/deployment in the GitHub UI
            deployment: false
        env: 
            IMAGE_TAG: ${{ github.event.workflow_run.head_sha}}

        if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'       }}
                  

        steps: 
           - name: Deployment information
             run: |
                echo "Deploying commit:"
                echo "$IMAGE_TAG"

                echo "Application:"
                echo "${{ vars.APP_NAME }}"

                echo "Target:"
                echo "${{ vars.APP_URL }}"
               
                
           - name: Validate deployment credentials
             env:
                DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
             
             run: |
                if [[ -z "$DEPLOY_TOKEN" ]]; then
                    echo "::error::Deployment credential missing"
                    exit 1
                fi

                echo "Deployment credentials available."


           - name: Mock pull image
             run: |
                echo "Would pull:"
                echo "ghcr.io/${{ github.repository }}:$IMAGE_TAG"


           - name: Mock deployment
             run: |
                echo "Stopping old container..."
                echo "Pulling new image..."
                echo "Starting application..."
                echo "Deployment successful."


           - name: Deployment summary
             run: |
                echo "### Staging Deployment" >> "$GITHUB_STEP_SUMMARY"
                echo "" >> "$GITHUB_STEP_SUMMARY"
                echo "- Commit: \`$IMAGE_TAG\`" >> "$GITHUB_STEP_SUMMARY"
                echo "- Environment: staging" >> "$GITHUB_STEP_SUMMARY"
                echo "- Application: ${{ vars.APP_NAME }}" >> "$GITHUB_STEP_SUMMARY"
                echo "- URL: ${{ vars.APP_URL }}" >> "$GITHUB_STEP_SUMMARY"


    smoke-test-staging: 
        name: smoke test for Stagging Environment
        runs-on: ubuntu-latest
        needs: [deploy-stagging]
        environment:
            name: Stagging
            deployment: false
        steps:
        - name: Test App Health
          run: | 
            echo "Testing ${{ vars.APP_URL }}/health"
            if [[ "${{ vars.MOCK_HEALTH }}" == "healthy" ]]; then
                echo "Health check passed."
            else
                echo "::error::Staging health check failed."
                exit 1
            fi



    deploy-production:
        name: deploy to production
        needs: [ smoke-test-staging ]
        runs-on: ubuntu-latest
        environment: 
            name: Production
            url: ${{vars.APP_URL}}
        
        env: 
            IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        
        steps: 
        -   name: Validate production secret
            env:
              DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
            run: |
                if [[ -z "$DEPLOY_TOKEN" ]]; then
                    echo "::error::Missing production deployment token"
                exit 1
                fi
                echo "Production credential available."

        -   name: Mock production deployment
            run: |
                echo "Deploying:"
                echo "$IMAGE_TAG"
                echo "To:"
                echo "${{ vars.APP_URL }}"

                echo "Production deployment completed."



    smoke-test-production:
        name: Production smoke test

        needs:
        - deploy-production

        runs-on: ubuntu-latest

        environment:
            name: production
            deployment: false

        steps:
        - name: Production health check
          run: |
            echo "Testing ${{ vars.APP_URL }}/health"

            if [[ "${{ vars.MOCK_HEALTH }}" == "healthy" ]]; then
                echo "Production health check passed."
            else
                echo "::error::Production health check failed."
                exit 1
            fi


    rollback-production:
            name: Rollback production

            needs:
            - deploy-production
            - smoke-test-production

            if: >
                always() &&
                needs.deploy-production.result == 'success' &&
                needs.smoke-test-production.result == 'failure'

            runs-on: ubuntu-latest

            steps:
            - name: Mock rollback
              run: |
                echo "::warning::Production validation failed."
                echo "Starting rollback..."
                echo "Restoring previous known-good version."
                echo "Rollback completed."


    deployment-report:
        name: Deployment report

        needs:
        - deploy-stagging
        - smoke-test-staging
        - deploy-production
        - smoke-test-production
        - rollback-production

        if: always()

        runs-on: ubuntu-latest

        steps:
        - name: Write deployment summary
          run: |
            echo "## Deployment Report" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"

            echo "| Stage | Result |" >> "$GITHUB_STEP_SUMMARY"
            echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"

            echo "| Staging deploy | ${{ needs.deploy-staging.result }} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Staging smoke test | ${{ needs.smoke-test-staging.result }} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Production deploy | ${{ needs.deploy-production.result }} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Production smoke test | ${{ needs.smoke-test-production.result }} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Rollback | ${{ needs.rollback-production.result }} |" >> "$GITHUB_STEP_SUMMARY"
