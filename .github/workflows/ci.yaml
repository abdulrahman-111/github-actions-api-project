##"When I push my code to GitHub, GitHub automatically runs my tests."
name: ci workflow

on:
    push:
        branches:
        - main
    pull_request:
        branches:
        - main


jobs:

  lint:
    name: Linting check and fix with RUFF 
    runs-on: ubuntu-latest
    steps:

    - name: " Trigger: push"
      run: echo ${{ github.event_name }}
      if: ${{ github.event_name == 'push' }}

    - name: " Trigger: pull request"
      run: echo ${{ github.event_name }}
      if: ${{ github.event_name == 'pull_request' }}

    - name: "Run on branch main "
      run : echo  ${{ github.ref}}
      if: ${{ github.ref == 'refs/heads/main' }}

    - name: run on commit-message have BUG-FIX
      run : echo BUG FIX 
      if : ${{ contains(github.event.head_commit.message,'BUG') }}





    - name: Checkout repository
      uses: actions/checkout@v7
            
    - name: Install uv 
      uses:  astral-sh/setup-uv@v10.0.1
      with: 
        enable-cache: true
            
    - name: set up  python 
      uses: actions/setup-python@v7
      with: 
        python-version-file: .python-version


    - name: install dependencies
      run: uv sync --locked  --dev

    - name: run Ruff
      run: uv run ruff check . 
      ##  --fix  -> without it , if there are any error it will fail 
      ## we will not use --fix in the ci -> as it will change the files only in the runner
      ## we make developer run it locally 
      ## ci -> is this code acceptable ?   


    - name: Minimize uv cache
      run: uv cache prune --ci



  test:
        name: Unit Testing using pytest 
        needs: 
        - lint
        runs-on: ubuntu-latest
        steps:
          - name: Checkout repository
            uses: actions/checkout@v7
            
          - name: Install uv 
            uses:  astral-sh/setup-uv@v10.0.1
            with: 
              enable-cache: true
            
          - name: set up  python 
            uses: actions/setup-python@v7
            with: 
              python-version-file: .python-version

          - name: install dependencies
            run: uv sync --locked  --dev

          - name: run tests
            run: uv run pytest 

          - name: Minimize uv cache
            run: uv cache prune --ci
  
  report:
    name: Generate Failure report 
    runs-on: ubuntu-latest
    needs: [lint , test ]
    if: ${{ failure() }} # An ancestor job/step in the dependency chain failed. [lint, test]
    steps:
      - name: Generate failure report
        run: |
          echo "======================"
          echo "CI FAILURE REPORT"
          echo "lint result ${{ needs.lint.result }}"
          echo "Test Result ${{ needs.test.result }}"
          echo "workflow: ${{ github.workflow }}"
          echo "COMMIT: ${{ github.sha }}"
          echo "Branch: ${{github.ref }}"
          echo "==============================="