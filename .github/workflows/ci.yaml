##"When I push my code to GitHub, GitHub automatically runs my tests."
name: ci workflow

on:
    push:
        branches:
        - main
    pull_request:
        branches:
        - main


jobs:

  lint:
    name: Linting check and fix with RUFF 
    
    # strategy: 
    #   fail-fast: false
    #   max-parallel: 3
    #   matrix:
    #     os: [ ubuntu-latest ] #  os: [ ubuntu-latest, windows-latest, macos-latest ]
    #     python_version: [3.1] 

    runs-on: ubuntu-latest
    steps:

    - name: Checkout repository
      uses: actions/checkout@v7
            
    - name: Install uv  & Enable Caching 
      uses:  astral-sh/setup-uv@v10.0.1
      with: 
        enable-cache: true
            
    - name: set up  python 
      uses: actions/setup-python@v7
      with: 
        python-version-file: .python-version
        # python-version: ${{ matrix.python_version }}
    
    - run:  python  --version 
   
    
    - name: install dependencies
      run: uv sync --locked  --dev

    - name: run Ruff
      run: uv run ruff check . 
      ##  --fix  -> without it , if there are any error it will fail 
      ## we will not use --fix in the ci -> as it will change the files only in the runner
      ## we make developer run it locally 
      ## ci -> is this code acceptable ?   


    # - name: Minimize uv cache
    #   run: uv cache prune --ci

# The uv cache prune --ci command is used to reduce the size of the cache and is optimized for CI. 

  test:
        name: Unit Testing using pytest 
        needs: 
        - lint
        runs-on: ubuntu-latest
        steps:
          - name: Checkout repository
            uses: actions/checkout@v7 
            
          - name: Install uv 
            uses:  astral-sh/setup-uv@v10.0.1
            with: 
              enable-cache: true
            
          - name: set up  python 
            uses: actions/setup-python@v7
            with: 
              python-version-file: .python-version

          - name: install dependencies
            run: uv sync --locked  --dev

          # - name: run tests
          #   run: uv run  pytest 
          
          - name: Generate coverage report & and run tests 
            run: uv run pytest --cov=github_actions_api_project --cov-report=xml
          
          - name: Upload Artifacts
            uses: actions/upload-artifact@v4
            with:
                name: coverage_report
                path: coverage.xml

          #- name: Minimize uv cache
           # run: uv cache prune --ci
  

  artifacts:
    name: downlaod artifact
    runs-on: ubuntu-latest
    needs: [lint,test]
    steps:
      - name : download artifact
        uses: actions/download-artifact@v5 
        with:
            name: coverage_report
      - run: ls -la 



  report:
    name: Generate Failure report 
    runs-on: ubuntu-latest
    needs: [lint , test ]
    if: ${{ failure() }} # An ancestor job/step in the dependency chain failed. [lint, test]
    steps: 
      - name: Generate failure report
        run: |
          echo "======================"
          echo "CI FAILURE REPORT"
          echo "lint result ${{ needs.lint.result }}"
          echo "Test Result ${{ needs.test.result }}"
          echo "workflow: ${{ github.workflow }}"
          echo "COMMIT: ${{ github.sha }}"
          echo "Branch: ${{github.ref }}"
          echo "==============================="



  build_image:
    name: Docker image Build 
    runs-on: ubuntu-latest
    needs: [ test]
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    

    # not good practice
    # - name: Build the image
    #   run: docker build -t api:test .

    # - name: run container
    #   run : |
    #     docker run -d --name task-api -p 8000:8000 api:test

    # - name: test health of api 
    #   run: |
    #     sleep 3
    #     curl --fail http://localhost:8000/health
    
    # - name: Show logs of container if failure
    #   run : docker logs task-api
    #   if: ${{ failure()  }}

    # - name : delete container
    #   run : docker rm -f task-api
    #   if: ${{ always() }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
       registry: ghcr.io
       username: ${{ github.actor }}
       password: ${{ secrets.GITHUB_TOKEN }} ## This token created by github for me 

       # GitHub automatically creates this unique secret at the start of every workflow 
# job to handle repository authentication without requiring a manual Personal Access Token (PAT).
   

    - name: Docker metadata # Atutomatic add metadata and lables and tags for image
      id: meta ## give id to the step to reference it 
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha


    - name: Build and push Docker image
      if: ${{ github.event_name != 'pull_request' }}

      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

        # tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
        ## make tag with the hash of commit

# the image will be package ->we can see it in repo 