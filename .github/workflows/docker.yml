name: Docker 

on:
    push:
        branches:
        - main
        tags:
          - "v*"
    pull_request:
        branches:
        - main

jobs:
  resuable_workflow_job:
    uses: ./.github/workflows/reusable-ci.yaml
    with:
        python-version: "3.13"

  build_image:
    name: Docker image Build 
    needs: [ resuable_workflow_job ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      if: startsWith(github.ref, 'refs/tags/v')
      with:
       registry: ghcr.io
       username: ${{ github.actor }}
       password: ${{ secrets.GITHUB_TOKEN }} ## This token created by github for me 
   

    - name: Docker metadata # Atutomatic add metadata and lables and tags for image
      id: meta ## give id to the step to reference it 
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha


    - name: Build and push Docker image
      # if: ${{ github.event_name != 'pull_request' }}

      uses: docker/build-push-action@v5
      with:
        context: .
        push: ${{ startsWith(github.ref, 'refs/tags/v') }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}


